{% load i18n %}
<div id="delete_modal" class="rounded-2xl drop-shadow-2xl shadow-black w-full py-4
            bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
    <div class="px-4">
      <h2 class="pb-2 truncate">{% blocktrans %} Change role of {{ user_email }} {% endblocktrans %}</h2>
      <div class="pb-4">{% trans 'Are you sure you to change the workspace role of the user?' %}</div>
      <form id="change_user_role"
            action="{% url 'change_user_role' workspace_id user_id %}"
            method="post"
            class="flex gap-1 text-black dark:text-slate-200 h-8 w-11/12!
                  [&>select]:bg-slate-200 dark:[&>select]:bg-slate-700
                  [&>input]:bg-slate-200! dark:[&>input]:bg-slate-700!
                  [&>input]:rounded-sm! [&>input]:w-38! min-[460px]:[&>input]:w-60!"
            autocomplete="off">
          {% csrf_token %}

          {% for field in form %}{{ field }}{% endfor %}
          <button id="submit_change_role"
                  class="flex! items-center justify-center rounded-sm!"
                  type="submit">
            {% trans 'Submit' %}
          </button>
          <div id="cancel_change_role" @click="show_delete_modal = false"
                class="flex! items-center font-semibold text-primary border-2 border-primary rounded-md cursor-pointer hover:bg-primary hover:text-white">
            <span class="px-1">{% trans 'Cancel' %}</span>
          </div>
      </form>
    </div>
</div>
