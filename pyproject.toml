[project]
name = "pdfding"
# do not change the version line position as it will break the automated update after a release
version = "1.13.0"
description = "Selfhosted PDF manager, viewer and editor offering a seamless user experience on multiple devices."
authors = [
  { name = "mrmn" },
]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[tool.poetry.dependencies]
python = ">=3.12 <4.0"
django = "==6.1.2"
django-allauth = { extras = ["mfa", "socialaccount"], version = "==65.20.1" }
django-htmx = "==1.29.0"
gunicorn = "==26.2.0"
huey = "==3.5.3"
psycopg2-binary = "==2.9.13"
pypdfium2 = "==5.14.0"
pypdf = "==6.21.4"
python-magic = "==0.4.27"
qrcode = { extras = ["pil"], version = "==8.2" }
whitenoise = { extras = ["brotli"], version = "==6.12.0" }

[tool.poetry.group.dev.dependencies]
bandit = "==1.9.4"
black = "==26.10.1"
flake8 = "==7.4.1"
pytest = "==9.1.1"
pytest-cov = "==7.1.0"
pytest-django = "==4.14.0"

[tool.poetry.group.e2e.dependencies]
pytest-playwright = "==0.10.0"
pytest-xdist = "==3.8.0"

[tool.black]
line-length = 120
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pdfding.core.settings.test"
markers = [
      "pdfjs",
]

[tool.bandit]
exclude_dirs = ["tests", "path/to/file"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
atomic = true
profile = "black"
line_length = 120
skip_gitignore = true
